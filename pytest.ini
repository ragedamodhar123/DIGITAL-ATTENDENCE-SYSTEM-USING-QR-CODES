[pytest]
testpaths = tests
addopts = -ra
# Warnings are errors, so deprecated code is fixed early instead of breaking
# silently after an upgrade. Later lines override earlier ones.
filterwarnings =
    error::DeprecationWarning
    error::sqlalchemy.exc.SAWarning
    # Inside Flask-Login itself (remember-me cookie), not our code. Remove when Flask-Login fixes it.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:flask_login